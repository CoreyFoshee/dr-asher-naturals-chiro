version: 1
frontend:
  phases:
    preBuild:
      commands: []
    build:
      commands: []
  artifacts:
    baseDirectory: drasher-static/drashernaturals.com
    files:
      - '**/*'
  cache:
    paths: []
customRedirects:
  - source: /index.html
    target: /
    status: '301'
  - source: /<*>/index.html
    target: /<*>/
    status: '301'
  - source: /index.html<p*>
    target: /
    status: '301'
  - source: /reviews
    target: /
    status: '302'
  - source: /reviews/
    target: /
    status: '302'
  - source: /reviews/<*>
    target: /
    status: '302'
