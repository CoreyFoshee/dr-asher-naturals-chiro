version: 1
frontend:
  phases:
    preBuild:
      commands: []
    build:
      commands:
        - rm -rf .amplify-hosting
        - mkdir -p .amplify-hosting/static .amplify-hosting/compute/default
        - cp -R drasher-static/drashernaturals.com/. .amplify-hosting/static/
        - cp api/server.mjs api/load-env.mjs api/email.mjs .amplify-hosting/compute/default/
        - printf '%s\n' '{ "type": "module" }' > .amplify-hosting/compute/default/package.json
        - |
          python3 - <<'PY'
          import os
          from pathlib import Path
          dest = Path(".amplify-hosting/compute/default/.env")
          keys = [
              "MAILEROO_API_KEY",
              "MAILEROO_FROM_EMAIL",
              "MAILEROO_FROM_NAME",
              "MAILEROO_TO_EMAILS",
              "MAILEROO_API_URL",
              "CONTACT_ALLOWED_ORIGINS",
          ]
          lines = []
          for key in keys:
              value = os.environ.get(key, "")
              if value:
                  lines.append(f"{key}={value}")
          dest.write_text("\n".join(lines) + "\n")
          print("Wrote compute env with", len(lines), "keys")
          PY
        - cp api/deploy-manifest.json .amplify-hosting/deploy-manifest.json
  artifacts:
    baseDirectory: .amplify-hosting
    files:
      - '**/*'
  cache:
    paths: []
customRedirects:
  - source: /index.html
    target: /
    status: '301'
  - source: /<*>/index.html
    target: /<*>/
    status: '301'
  - source: /index.html<p*>
    target: /
    status: '301'
  - source: /reviews
    target: /
    status: '302'
  - source: /reviews/
    target: /
    status: '302'
  - source: /reviews/<*>
    target: /
    status: '302'
  - source: /make-an-appointment
    target: /schedule-appointment/
    status: '301'
  - source: /make-an-appointment/
    target: /schedule-appointment/
    status: '301'
